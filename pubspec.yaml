name: english_ai
description: "AI-powered English speaking and writing learning app built with Flutter and FastAPI."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  audio_session: ^0.1.25
  record: ^6.1.1
  path_provider: ^2.1.5
  flutter_riverpod: ^2.5.0
  go_router: ^14.1.0
  path: ^1.9.0
  just_audio: ^0.9.39
  web_socket_channel: ^3.0.0
  permission_handler: ^11.3.0
  image_picker: ^1.1.2
  http: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - server/dictionaries/todays_expressions.json
    - assets/roleplay/
    - assets/roleplay/backgrounds/
