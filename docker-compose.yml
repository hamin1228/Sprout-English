services:
  backend:
    build:
      context: ./server
    container_name: sprout-english-backend
    ports:
      - "8000:8000"
    environment:
      DB_USER: ${DB_USER:-ea}
      DB_PASSWORD: ${DB_PASSWORD:-ea_pw}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-english_ai}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - audio_data:/app/app/storage/audio
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: sprout-english-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-english_ai}
      MYSQL_USER: ${DB_USER:-ea}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ea_pw}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data:
  audio_data:
