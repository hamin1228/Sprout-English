# FILE: english_ai/server/pyproject.toml
[project]
name = "english-ai-server"
version = "0.1.0"
description = "FastAPI backend for AI English learning app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "SQLAlchemy>=2.0",
  "asyncmy>=0.2",
  "greenlet>=3.0",
  "pydantic-settings>=2.2",
  "python-multipart>=0.0.9",
  "orjson>=3.10",
  # 테스트/도구
  "websockets>=12.0",
]

[tool.uv]
# uv 전용 설정이 있다면 여기에